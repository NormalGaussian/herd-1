kind: cloosterconfig
name: herd-1
talos:
  cluster:
    # IPs for the cluster
    # 10.1.3.1/28
    # 10.1.3.0 -> 10.1.3.15
    ip: 10.1.3.1
  nodes:
    all:
      config-patch:
        - config-patch/dhcp.yaml
        - config-patch/install-disk.yaml
        - config-patch/interface-names.yaml
        - config-patch/kubelet-certificates.yaml
        - config-patch/virtual-ip.yaml
    control-plane:
      ips:
        # IPs for the control plane nodes
        # 10.1.3.33/28
        # 10.1.3.32 -> 10.1.3.47
        - 10.1.3.1
        - 10.1.3.2
        #- 10.1.3.34
        #- 10.1.3.35
      config-patch:
        - config-patch/allow-controlplane-workloads.yaml
    worker:
      ips: []
        # IPs for the worker nodes
        # 10.1.3.48/28
        # 10.1.3.48 -> 10.1.3.63
        #- 10.1.3.49
        #- 10.1.3.50
        #- 10.1.3.51
      config-patch: []
